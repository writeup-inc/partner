const mobile=window.matchMedia('(max-width:600px)');
let viewPreference=null,activeTypes=new Set(Object.keys(TYPES));
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Calendar dates are date-only; UTC prevents a viewer's timezone shifting the weekday.
const parseDate=s=>new Date(s+'T12:00:00Z');
const dateKey=d=>`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
const dayOfWeek=s=>WEEKDAYS[parseDate(s).getUTCDay()];
const fullDate=s=>{const d=parseDate(s);return `2026年${d.getUTCMonth()+1}月${d.getUTCDate()}日（${dayOfWeek(s)}）`;};
const eventStyle=e=>`--event-color:${TYPES[e.type].color};--event-bg:${TYPES[e.type].bg}`;
const selectedEvents=()=>EVENTS.filter(e=>activeTypes.has(e.type)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
function gridHTML(month,ev){
  const start=new Date(Date.UTC(2026,month,1));start.setUTCDate(1-start.getUTCDay());
  const cells=Math.ceil((new Date(Date.UTC(2026,month,1)).getUTCDay()+new Date(Date.UTC(2026,month+1,0)).getUTCDate())/7)*7;
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  let html='<div class="month-table"><div class="weekdays" aria-hidden="true">'+WEEKDAYS.map(w=>`<span class="weekday">${w}</span>`).join('')+'</div><div class="calendar-grid">';
  for(let i=0;i<cells;i++){
    const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const key=dateKey(d),own=d.getUTCMonth()===month,dayEvents=own?ev.filter(e=>e.date===key):[];
    html+=`<div class="day ${own?'':'other'} ${d.getUTCDay()===0?'sun':''} ${d.getUTCDay()===6?'sat':''} ${key===today?'today':''}" data-date="${key}"><span class="day-number" ${key===today?'aria-current="date"':''}>${d.getUTCDate()}</span>`;
    html+=dayEvents.map(e=>`<button type="button" class="event" data-event="${e.id}" style="${eventStyle(e)}" aria-label="${escapeHTML(fullDate(e.date)+' '+e.start+'から'+e.end+' '+e.title+'（仮）')}"><span class="event-time">${e.start}–${e.end}</span><span class="event-title">${escapeHTML(e.title)}</span></button>`).join('');
    if(dayEvents.length)html+=`<button type="button" class="day-mobile" data-day="${key}" aria-label="${fullDate(key)}、${dayEvents.length}件の予定"><span class="mobile-dots">${dayEvents.map(e=>`<span class="dot" style="${eventStyle(e)}"></span>`).join('')}</span><span class="mobile-count">${dayEvents.length}件</span></button>`;
    html+='</div>';
  }
  return html+'</div></div>';
}
function agendaHTML(ev){
  return '<div class="agenda">'+ev.map(e=>`<button type="button" class="agenda-row" data-event="${e.id}" style="${eventStyle(e)}"><span class="agenda-date">${parseDate(e.date).getUTCDate()}日（${dayOfWeek(e.date)}）</span><span class="agenda-time">${e.start}–${e.end}</span><span class="agenda-title">${escapeHTML(e.title)}<span class="agenda-mobile-time"><span class="dot"></span>${e.start}–${e.end} ／ ${TYPES[e.type].label}</span></span><span class="agenda-type"><span class="dot"></span>${TYPES[e.type].label}</span></button>`).join('')+'</div>';
}
function render(){
  const view=viewPreference??(mobile.matches?'list':'calendar'),events=selectedEvents();
  $('calendarButton').setAttribute('aria-pressed',String(view==='calendar'));$('listButton').setAttribute('aria-pressed',String(view==='list'));
  $('eventCount').textContent=`全${events.length}件`;
  $('resetFilters').hidden=activeTypes.size===Object.keys(TYPES).length;
  $('months').innerHTML=MONTHS.map(month=>{
    const ev=events.filter(e=>parseDate(e.date).getUTCMonth()===month);
    return `<section class="month-section" id="month-${month+1}" aria-labelledby="title-${month+1}"><div class="month-heading"><h2 id="title-${month+1}">${month+1}月</h2><span class="year">2026年</span><span class="month-count">${ev.length}件の予定</span></div>${ev.length===0?'<div class="empty">この条件に一致する予定はありません。</div>':view==='calendar'?gridHTML(month,ev):agendaHTML(ev)}</section>`;
  }).join('');
  wireEvents($('months'));
  $('months').querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>openDay(b.dataset.day)));
}
function wireEvents(container){container.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>openEvent(b.dataset.event)));}
function showDialog(){if(!$('eventDialog').open)$('eventDialog').showModal();}
function openEvent(id){
  const e=EVENTS.find(e=>e.id===id);if(!e)return;
  $('dialogTag').setAttribute('style',eventStyle(e));$('dialogTag').innerHTML=`<span class="dot"></span>${TYPES[e.type].label}（仮）`;
  $('dialogContent').innerHTML=`<h2 id="dialogTitle">${escapeHTML(e.title)}</h2><div class="detail-meta"><p><strong>${fullDate(e.date)}</strong></p><p>${e.start}–${e.end} <span style="color:var(--muted)">／ 日本時間</span></p><p>オンライン開催（仮）</p><p>対象：契約済みの正規パートナー企業</p></div><p class="description">${escapeHTML(e.description)}</p><h3>この回で扱うテーマ（仮）</h3><ul class="topics">${e.topics.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul><p class="detail-note">参加URL・申込受付は未設定です。<br>開催日時・内容は確定後に更新します。</p>`;
  showDialog();$('eventDialog').scrollTop=0;
}

function openDay(key){
  const ev=selectedEvents().filter(e=>e.date===key);if(ev.length===1){openEvent(ev[0].id);return;}
  $('dialogTag').removeAttribute('style');$('dialogTag').textContent='この日の予定（仮）';
  $('dialogContent').innerHTML=`<h2 id="dialogTitle">${fullDate(key)}</h2><div class="day-events">${ev.map(e=>`<button type="button" data-event="${e.id}" style="${eventStyle(e)}"><small>${e.start}–${e.end} ／ ${TYPES[e.type].label}</small><strong>${escapeHTML(e.title)}</strong></button>`).join('')}</div>`;wireEvents($('dialogContent'));showDialog();
}
$('calendarButton').addEventListener('click',()=>{viewPreference='calendar';render();});
$('listButton').addEventListener('click',()=>{viewPreference='list';render();});
document.querySelectorAll('.filters input').forEach(input=>input.addEventListener('change',()=>{input.checked?activeTypes.add(input.value):activeTypes.delete(input.value);render();}));
$('resetFilters').addEventListener('click',()=>{activeTypes=new Set(Object.keys(TYPES));document.querySelectorAll('.filters input').forEach(i=>i.checked=true);render();});
$('closeDialog').addEventListener('click',()=>$('eventDialog').close());
$('eventDialog').addEventListener('click',e=>{if(e.target!==$('eventDialog'))return;const r=$('eventDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('eventDialog').close();});
mobile.addEventListener('change',render);render();
</script>
</body>
</html>
